    <!-- Primeira dobra da home renderizada em HTML estático no build (src/shell/homeShell.tsx); o React a substitui ao montar -->
    <div id="root"><!-- HOME_SHELL --></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Scripts de terceiros (GTM + pixel AGMetrics): carregados só depois da primeira interação
      (rolagem, toque, tecla, clique ou movimento do mouse) para não disputar a main thread no carregamento.
      Configuração:
        FALLBACK_MS  tempo (após o evento load) para carregar mesmo sem interação, para não perder visitas
                     que saem sem interagir. Use 0 para carregar SOMENTE após interação.
        /obrigado    carrega na hora: é a página de conversão e o evento thank_you_page não pode se perder.
    -->
    <script>
      (function () {
        var GTM_ID = "GTM-WGCP886Q";
        var PIXEL_SRC = "https://wsqckbceejdshbmjingp.supabase.co/functions/v1/tracking-pixel?pid=ac4eeec0-6e2d-4729-baff-ed63041ac77f&track=all";
        var FALLBACK_MS = 8000;
        var EVENTS = ["scroll", "pointerdown", "touchstart", "keydown", "mousemove"];
        var started = false;

        function start() {
          if (started) return;
          started = true;
          EVENTS.forEach(function (e) { window.removeEventListener(e, start); });

          // Google Tag Manager
          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
          var gtm = document.createElement("script");
          gtm.async = true;
          gtm.src = "https://www.googletagmanager.com/gtm.js?id=" + GTM_ID;
          document.head.appendChild(gtm);

          // AGMetrics (page views, cliques, profundidade de scroll e mapa de calor)
          var px = document.createElement("script");
          px.async = true;
          px.src = PIXEL_SRC;
          document.body.appendChild(px);
        }

        if (/^\/obrigado\/?$/.test(location.pathname)) return start();
        EVENTS.forEach(function (e) { window.addEventListener(e, start, { passive: true }); });
        if (FALLBACK_MS > 0) {
          window.addEventListener("load", function () { setTimeout(start, FALLBACK_MS); });
        }
      })();
    </script>
  </body>
