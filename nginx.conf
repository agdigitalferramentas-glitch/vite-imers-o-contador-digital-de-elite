server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # cache de assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # fontes auto-hospedadas (nomes estáveis, sem hash)
  location /fonts/ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # index.html sempre revalidado (publica novas versões na hora)
  location = /bf1126/index.html {
    add_header Cache-Control "no-cache";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback
  # /bf1126 → bf1126/index.html (primeira dobra estática própria)
  location / {
    try_files $uri $uri/index.html $uri/ /index.html;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml image/x-icon;
}
