server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # cache de assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # fontes auto-hospedadas (nomes estáveis, sem hash)
  location /fonts/ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # index.html sempre revalidado (publica novas versões na hora)
  # Única página que continua no ar: /obrigado (SPA).
  location ~ ^/obrigado/?$ {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
  }

  # Todas as demais páginas (inclusive as inexistentes, /index.html, /bf1126/ e /combo/): 301 para o site principal.
  # A guarda de host evita laço caso este app seja servido no próprio domínio de destino.
  location / {
    if ($host !~* "^(www\.)?black26\.andersonmaisse\.com$") {
      return 301 https://black26.andersonmaisse.com/;
    }
    try_files $uri $uri/index.html $uri/ /index.html;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml image/x-icon;
}
